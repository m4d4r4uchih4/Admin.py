
<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
</head>
<body>
    <h2>Admin Panel</h2>
    <form method="POST">
        <input type="text" name="entry" placeholder="Add New Entry" required>
        <button type="submit">Add</button>
    </form>

    <ul>
        {% for item in data %}
            <li>{{ item.entry }}
                <a href="{{ url_for('delete', index=loop.index0) }}">[Delete]</a>
            </li>
        {% endfor %}
    </ul>

    <br>
    <a href="/logout">Logout</a>
</body>
</html>
